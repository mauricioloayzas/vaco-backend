helper-get-batch-statuses:
  handler: services/helper/get-batch-statuses.php
  runtime: php-84
  layers:
    - ${self:custom.vendorLayerArn}
  description: "Obtiene los estados de lote disponibles"
  events:
    - httpApi:
        method: GET
        path: /helper/batch-statuses
        authorizer: cognitoAuthorizer

